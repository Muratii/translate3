name: Build Kotlin APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Adım: Kodlarınızı sunucuya çekin
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Adım: Java (JDK 17) kurulumunu yapın
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. Adım: Resmi Gradle modülünü çalıştırın
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # 4. Adım: Linux sunucusunda derleme izni verin (Gerekliyse)
    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew
      continue-on-error: true

    # 5. Adım: APK dosyasını derleyin
    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    # 6. Adım: Oluşan APK'yı indirme alanına yükleyin
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: cevirmen-apk
        path: "**/build/outputs/apk/debug/*.apk"
