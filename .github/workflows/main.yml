name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        run: gradle assembleDebug --no-daemon
        working-directory: .github/workflows

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cevirmen-apk
          path: .github/workflows/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp .github/workflows/app/build/outputs/apk/debug/app-debug.apk \
             Cevirmen-${GITHUB_REF_NAME}.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "Cevirmen-${GITHUB_REF_NAME}.apk" \
            --title "Cevirmen ${GITHUB_REF_NAME}" \
            --generate-notes