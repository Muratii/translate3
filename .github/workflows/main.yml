name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hint Ingilizcesi ses modelini indir
        run: |
          mkdir -p app/src/main/assets
          curl -L -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip
          unzip -q model.zip
          rm -rf app/src/main/assets/model
          mv vosk-model-small-en-in-0.4 app/src/main/assets/model
          ls app/src/main/assets/model
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: .github/workflows
      - uses: actions/upload-artifact@v4
        with:
          name: cevirmen-apk
          path: .github/workflows/app/build/outputs/apk/debug/app-debug.apk
